# The backend workspace.
#
# Deliberately SEPARATE from `../smart-contract`, and never merged with it. `[profile.release]`
# only applies at a workspace root, so merging would silently discard the contract's
# `opt-level = "z"` / `lto` / `strip` settings and ship a much larger wasm. See
# `../docs/12-deployment.md`.

[workspace]
resolver = "2"
members = [
    "crates/settle-domain",
    "crates/settle-chain",
    "crates/settle-db",
    "crates/settle-auth",
    "crates/settle-indexer",
    "crates/settle-signature",
    "crates/settle-backend",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tokio = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = "2"
stellar-strkey = "0.0.18"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "migrate", "macros",
] }
stellar-xdr = { version = "23", default-features = false, features = ["std", "base64", "curr"] }

# `deny`, not `forbid`: a dependency's derive macro may legitimately emit an allow, and forbid
# cannot be overridden even where it should be.
[workspace.lints.rust]
unsafe_code = "deny"

# Overflow is a wrong number, and a wrong number in a money path is the bug this whole system is
# arranged to prevent. Panicking is the correct response in both profiles.
[profile.release]
overflow-checks = true

[profile.test]
overflow-checks = true
