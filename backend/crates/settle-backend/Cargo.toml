[package]
name = "settle-backend"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The SettleFlow SOW 1 HTTP service"

[[bin]]
name = "settle-backend"
path = "src/main.rs"

[dependencies]
settle-domain = { path = "../settle-domain" }
settle-chain = { path = "../settle-chain" }
settle-db = { path = "../settle-db" }
settle-auth = { path = "../settle-auth" }
settle-indexer = { path = "../settle-indexer" }
settle-signature = { path = "../settle-signature" }

axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "process", "sync"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
hex.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx.workspace = true

[lints]
workspace = true
