# SettleFlow — the single front door.
#
# On a VM there is one port open and one origin. Everything a browser reaches arrives here, so the
# routing is readable in one file rather than inferred from four published ports.
#
#   /            the website — create and approve payments
#   /admin       the operations console
#   /api/…       the backend, with the prefix stripped
#   /healthz     this file
#
# The same file serves `make dev` and `make prod`. The difference between them is not the routing —
# it is that `prod` also moves every other published port to loopback, so this becomes the only way
# in. Development publishes them as well, which is what lets the demo and verification scripts talk
# to the backend directly.

# Upstreams are resolved AT REQUEST TIME, not at start-up.
#
# nginx resolves a name in a static `proxy_pass` exactly once, when it loads its configuration.
# Recreating any service gives it a new address and nginx keeps sending traffic to the old one —
# every request 502s until nginx itself is restarted, so redeploying one service takes the whole
# front door down with it. Docker's embedded DNS is at 127.0.0.11; putting the target in a VARIABLE
# is what forces the per-request lookup.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 3s;

limit_req_zone $binary_remote_addr zone=app:10m rate=30r/s;

server {
    listen 80;
    # IPv6 too. Without it a health check that resolves `localhost` gets ::1 first and is refused —
    # the container reads as unhealthy while serving every real request perfectly.
    listen [::]:80;
    server_name _;

    client_max_body_size 1m;
    proxy_http_version 1.1;

    # $http_host, NOT $host: $host drops the port, and an upstream that builds an absolute URL from
    # the Host header then fills the gap with its OWN listening port — so a redirect from the
    # console came back pointing at localhost:5174, a port published on loopback that no browser
    # outside the VM can reach.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Kept if the caller supplied one, so a client correlating its own retries stays correlated.
    proxy_set_header X-Request-Id      $http_x_request_id;

    # ── Health ───────────────────────────────────────────────────────────────
    #
    # Answered by nginx itself. `make prod` polls this to decide the stack is up, and a check that
    # depended on an upstream would report the front door down whenever the website was merely slow
    # to compile — a different fault, reported as this one.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── The operations console ───────────────────────────────────────────────
    #
    # Two Next.js apps at one origin cannot both own `/_next`, so the console is built with
    # `basePath: '/admin'` (frontend/admin/next.config.mjs) and serves its routes and its assets
    # under that prefix already. Nothing is rewritten here: the path arrives as the app expects it.
    #
    # `^~` so these win outright over any regex location, and an exact match for the bare `/admin`
    # so a prefix block cannot also swallow a future `/administrators`.
    location = /admin {
        limit_req zone=app burst=60 nodelay;
        set $admin_upstream admin:5174;
        proxy_pass http://$admin_upstream;
        proxy_read_timeout 60s;
    }

    location ^~ /admin/ {
        limit_req zone=app burst=60 nodelay;
        set $admin_upstream admin:5174;
        # No URI part after the host: with a variable in proxy_pass nginx forwards the request URI
        # unchanged rather than doing the prefix substitution a literal would trigger. Unchanged is
        # what the console's basePath expects.
        proxy_pass http://$admin_upstream;
        proxy_read_timeout 60s;
    }

    # ── The API ──────────────────────────────────────────────────────────────
    #
    # Straight to the backend, one hop rather than two. The website ships its own catch-all proxy at
    # app/api/[...path]/route.ts and that still answers on the website's own port, but through the
    # front door there is no reason for a request to enter Next.js only to leave it again.
    #
    # The backend serves `/requests`, not `/api/requests` — the prefix is ours, for routing, and is
    # stripped here. The rewrite is EXPLICIT because a variable in proxy_pass turns off the prefix
    # substitution a literal target would do, so without it `/api/requests` arrives at the backend
    # unchanged and 404s.
    location ^~ /api/ {
        limit_req zone=app burst=60 nodelay;
        set $backend_upstream backend:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
        # The SEP-10 sign-in round trip goes from here to Horizon and back; 60s is the backend's own
        # ceiling rather than a guess.
        proxy_read_timeout 60s;
    }

    # ── The website ──────────────────────────────────────────────────────────
    #
    # Last, and a plain prefix, so it is the fallback for everything above that did not match.
    #
    # The burst is generous because one page load is many requests — the document, its chunks, its
    # RSC payloads — and a limit tuned for API calls turns a normal first visit into a 503.
    location / {
        limit_req zone=app burst=120 nodelay;
        set $website_upstream website:5173;
        proxy_pass http://$website_upstream;
        proxy_read_timeout 60s;
    }
}
